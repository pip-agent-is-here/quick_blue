name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'scripts/check-okf.py'
      - 'scripts/test_check_okf.py'
      - 'scripts/check-docs-site.py'
      - 'scripts/requirements-docs.txt'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'scripts/check-okf.py'
      - 'scripts/test_check_okf.py'
      - 'scripts/check-docs-site.py'
      - 'scripts/requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Zensical recommends clean builds without CI build caches.
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: python scripts/check-okf.py
      - run: python -m unittest discover -s scripts -p 'test_check_okf.py'
      - run: zensical build --clean
      - run: python scripts/check-docs-site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.repository == 'prefanatic/quick_blue' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
