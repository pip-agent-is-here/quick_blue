name: Example app release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: example-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  build-android:
    name: Build Android example
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Check out released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd quick_blue/example
          flutter build apk --release
          cd "$GITHUB_WORKSPACE"
          asset="quick_blue-example-${RELEASE_TAG}-android.apk"
          cp quick_blue/example/build/app/outputs/flutter-apk/app-release.apk "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  build-ios:
    name: Build iOS simulator example
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Check out released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build and publish simulator app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd quick_blue/example
          flutter build ios --simulator --release
          cd "$GITHUB_WORKSPACE"
          asset="quick_blue-example-${RELEASE_TAG}-ios-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent quick_blue/example/build/ios/iphonesimulator/Runner.app "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  build-macos:
    name: Build macOS example
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Check out released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Build and publish macOS app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd quick_blue/example
          flutter build macos --release
          cd "$GITHUB_WORKSPACE"
          asset="quick_blue-example-${RELEASE_TAG}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent quick_blue/example/build/macos/Build/Products/Release/Runner.app "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    name: Build Linux x64 example
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Check out released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Build and publish Linux bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd quick_blue/example
          flutter build linux --release
          cd "$GITHUB_WORKSPACE"
          asset="quick_blue-example-${RELEASE_TAG}-linux-x64.tar.gz"
          tar -czf "$asset" -C quick_blue/example/build/linux/x64/release/bundle .
          sha256sum "$asset" > "$asset.sha256"
          gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    name: Build Windows x64 example
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Expected a versioned release tag like v1.2.3; got: $env:RELEASE_TAG"
          }
      - name: Check out released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build and publish Windows bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location quick_blue/example
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "Windows example build failed with exit code $LASTEXITCODE" }
          Pop-Location
          $asset = "quick_blue-example-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path 'quick_blue/example/build/windows/x64/runner/Release/*' -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$asset.sha256", "$hash  $asset`n", [Text.UTF8Encoding]::new($false))
          gh release upload $env:RELEASE_TAG $asset "$asset.sha256" --repo $env:GITHUB_REPOSITORY --clobber
