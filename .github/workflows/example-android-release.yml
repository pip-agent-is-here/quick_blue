name: Example Android release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: example-android-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload Android example APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a versioned release tag like v1.2.3; got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out the released source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        working-directory: quick_blue/example
        run: flutter build apk --release

      - name: Name APK and generate checksum
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          apk_source="quick_blue/example/build/app/outputs/flutter-apk/app-release.apk"
          apk_name="quick_blue-example-${RELEASE_TAG}-android.apk"
          checksum_name="${apk_name}.sha256"
          test -s "$apk_source"
          cp "$apk_source" "$apk_name"
          sha256sum "$apk_name" > "$checksum_name"
          echo "apk=$apk_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum_name" >> "$GITHUB_OUTPUT"

      - name: Upload assets to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.package.outputs.apk }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
